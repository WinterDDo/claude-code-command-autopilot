name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Full suite incl. dispatcher and no-python fallback
        run: sh tests/run-tests.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck plugins/skill-autopilot/hooks/run.sh install.sh uninstall.sh tests/run-tests.sh
      - name: JSON validity
        run: |
          python3 - <<'EOF'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts: continue
              json.loads(p.read_text(encoding='utf-8'))
              print('ok', p)
          EOF
